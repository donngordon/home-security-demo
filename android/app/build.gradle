plugins {
    id "com.android.application"
}

android {
    namespace "com.donn.homesecurity"
    compileSdk 34

    defaultConfig {
        applicationId "com.donn.homesecurity"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

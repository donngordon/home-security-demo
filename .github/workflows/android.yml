name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Put the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html security-icon-*.png android/app/src/main/assets/

      - name: Build the APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HomeSecurity.apk

      - name: Publish as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Home Security app (demo) ${{ github.run_number }}
          body: |
            Download **HomeSecurity.apk** on your Android phone, open it, and allow installing from this source when asked.
            This is the demo with sample data. It does not control a real home.
          files: HomeSecurity.apk
          make_latest: true
